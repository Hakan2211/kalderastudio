<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kaldera OG card</title>
    <!--
      Source for /og/kaldera-og.jpg. Rendered at exactly 1200×630 and captured
      to a JPEG; kept in the repo so the card can be re-shot when the brand
      line changes rather than hand-edited in an image editor.

      It is a designed card rather than a screenshot of the hero on purpose:
      the hero is a live WebGL scene whose best frame depends on scroll, and a
      share card has to read at 300 px wide in a timeline.
    -->
    <style>
      @font-face {
        font-family: "Archivo Expanded";
        font-weight: 900;
        font-stretch: 125%;
        src: url("/fonts/archivo.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 400;
        src: url("/fonts/jbmono.woff2") format("woff2");
      }
      * { margin: 0; box-sizing: border-box; }
      body { background: #0b0b0d; }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0b0d;
        color: #e8e5df;
      }
      /* Heat banked below the fissure — the page's own light direction. */
      .heat {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(90% 62% at 50% 92%, rgba(255,85,31,0.22) 0%, rgba(140,29,4,0.12) 42%, transparent 74%),
          radial-gradient(60% 40% at 50% 100%, rgba(255,217,160,0.10) 0%, transparent 70%);
      }
      svg { position: absolute; inset: 0; width: 1200px; height: 630px; }
      /* The mark, sitting above the wordmark as in the brand lockup. It is a
         separate file so it can never drift from the favicon — both are
         generated by scripts/build-brand.mjs. */
      .mark {
        position: absolute;
        left: 64px;
        top: 62px;
        width: 84px;
        height: 84px;
      }
      .wordmark {
        position: absolute;
        left: 64px;
        top: 176px;
        font-family: "Archivo Expanded", sans-serif;
        font-weight: 900;
        font-stretch: 125%;
        font-size: 156px;
        line-height: 0.86;
        letter-spacing: -0.012em;
      }
      .tag {
        position: absolute;
        left: 68px;
        top: 356px;
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #ff551f;
      }
      .foot {
        position: absolute;
        left: 68px;
        bottom: 56px;
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #8a8d93;
      }
      .corner {
        position: absolute;
        right: 68px;
        bottom: 56px;
        text-align: right;
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #8a8d93;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="heat"></div>
      <svg viewBox="0 0 1200 630">
        <!-- The fissure, same meander as the preloader, riding under the mark. -->
        <polyline
          points="0,462 60,475 108,463 156,489 204,481 252,516 300,508 336,542 384,550 432,538 468,556 528,548 576,562 624,554 660,540 696,546 744,528 792,534 840,518 888,522 936,508 996,514 1056,500 1116,504 1200,492"
          fill="none" stroke="#ff551f" stroke-width="7" stroke-linecap="round"
          stroke-linejoin="round" opacity="0.42" filter="blur(7px)" />
        <polyline
          points="0,462 60,475 108,463 156,489 204,481 252,516 300,508 336,542 384,550 432,538 468,556 528,548 576,562 624,554 660,540 696,546 744,528 792,534 840,518 888,522 936,508 996,514 1056,500 1116,504 1200,492"
          fill="none" stroke="#ffb377" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      <img class="mark" src="/og/mark.svg" alt="" />
      <div class="wordmark">KALDERA</div>
      <div class="tag">Forged on a single GPU.</div>
      <!-- The show is unannounced; it joins this line when it releases.
           Was: Aurea · Cinevido · Zoologic -->
      <div class="foot">Aurea · Cinevido · Original series</div>
      <div class="corner">54.2°N · 1× RTX 3090 Ti</div>
    </div>
  </body>
</html>
